<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, system-ui, sans-serif; 
      width: 280px; 
      padding: 16px; 
      background: #0a66c2; 
      color: white; 
    }
    h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .subtitle { font-size: 0.75rem; opacity: 0.75; margin-bottom: 16px; }
    
    label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 5px; opacity: 0.9; }
    input { 
      width: 100%; 
      padding: 9px 12px; 
      border-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.3); 
      margin-bottom: 12px; 
      background: rgba(255,255,255,0.15); 
      color: white; 
      font-size: 0.85rem; 
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    input:focus { outline: none; border-color: white; background: rgba(255,255,255,0.2); }
    
    .row { display: flex; gap: 8px; }
    .row input { margin-bottom: 12px; }
    
    button { 
      width: 100%; 
      padding: 11px; 
      border-radius: 20px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.9rem; 
      margin-bottom: 8px; 
      transition: 0.15s all; 
    }
    #startBtn { background: white; color: #0a66c2; }
    #startBtn:hover { background: #e8f0fe; }
    #stopBtn { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.5); }
    #stopBtn:hover { background: rgba(255,255,255,0.1); }
    
    .status { 
      font-size: 0.75rem; 
      text-align: center; 
      margin-top: 8px; 
      padding: 6px; 
      background: rgba(0,0,0,0.15); 
      border-radius: 6px; 
      min-height: 28px;
    }
  </style>
</head>
<body>
  <h2>🔗 LinkedIn Auto-Connect</h2>
  <p class="subtitle">Automatically search & send connection requests</p>
  
  <label for="searchQuery">Search Query:</label>
  <input type="text" id="searchQuery" placeholder="e.g. Software Developer Manager" />
  
  <div class="row">
    <div style="flex:1">
      <label for="limit">Max Requests:</label>
      <input type="number" id="limit" value="10" min="1" max="50" />
    </div>
    <div style="flex:1">
      <label for="delay">Delay (ms):</label>
      <input type="number" id="delay" value="8000" min="3000" step="1000" />
    </div>
  </div>
  
  <button id="startBtn">🚀 START Auto-Connect</button>
  <button id="stopBtn">⏹ STOP</button>
  
  <div class="status" id="statusText">Enter a search query and click START</div>
  
  <script src="popup.js"></script>
</body>
</html>
