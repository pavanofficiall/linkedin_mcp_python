<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, system-ui; width: 250px; padding: 15px; margin: 0; background: #0a66c2; color: white; }
    h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 5px; }
    p { font-size: 0.8rem; margin-bottom: 20px; opacity: 0.8; }
    label { font-size: 0.85rem; margin-bottom: 5px; display: block; font-weight: bold; }
    input { width: calc(100% - 10px); padding: 8px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.4); margin-bottom: 15px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 0.9rem; }
    button { width: 100%; padding: 12px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; transition: 0.2s all; border: 1px solid transparent; }
    button#startBtn { background: white; color: #0a66c2; }
    button#startBtn:hover { background: #e0e0e0; }
    button#stopBtn { background: transparent; color: white; border: 1px solid rgba(255, 255, 255, 0.5); }
    button#stopBtn:hover { background: rgba(255, 255, 255, 0.1); }
    .status { font-size: 0.75rem; text-align: center; margin-top: 10px; opacity: 0.9; }
  </style>
</head>
<body>
  <h2>LinkedIn Auto-Connect</h2>
  <p>Send personalized invites like a human.</p>
  
  <label for="limit">Connection Limit:</label>
  <input type="number" id="limit" value="10" min="1" max="50">
  
  <label for="delay">Avg Delay (ms):</label>
  <input type="number" id="delay" value="8000" min="2000" step="1000">
  
  <button id="startBtn">START Connecting</button>
  <button id="stopBtn">STOP Now</button>
  
  <div class="status" id="statusText">Go to any Search results page</div>
  
  <script src="popup.js"></script>
</body>
</html>
